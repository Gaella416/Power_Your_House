<!DOCTYPE html>
<html lang="en">
<head>
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>

<div class="settings-container">
  <h2>Settings</h2>

  <div class="section">
    <h3>Notifications</h3>
    <label>
      <input type="checkbox" id="lowPower">
      Low Power Alert
    </label>
    <label>
      <input type="checkbox" id="powerStatus">
      Power ON / OFF Alert
    </label>
    <label>
      <input type="checkbox" id="areaOutage">
      Area Power Outage Alert
    </label>
  </div>

  <div class="section">
    <h3>Meter Information</h3>
    <input type="text" id="meterNumber" placeholder="1234-1234-123">
    <input type="text" id="meterName" placeholder="Meter Name (e.g. Home)">
  </div>

  <div class="section">
    <h3>Security</h3>
    <label>
      <input type="checkbox" id="hideToken">
      Hide Token After Viewing
    </label>
  </div>

  <div class="section">
    <h3>App Preferences</h3>
    <select id="language">
      <option value="en">English</option>
      <option value="rw">Kinyarwanda</option>
    </select>
  </div>

  <button class="save-btn" onclick="saveSettings()">Save Settings</button>
  <p id="status"></p>
</div>

<script src="settings.js"></script>
</body>
</html>
